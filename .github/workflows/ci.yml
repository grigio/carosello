name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nickvision/ci:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            gettext

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: carosello-linux-x86_64
          path: target/release/carosello

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y rustc cargo

      - name: Generate Cargo sources for Flatpak
        run: |
          pip3 install toml
          python3 -c "
          import toml, json, hashlib

          with open('Cargo.lock') as f:
              lock = toml.load(f)

          registry_hash = hashlib.md5(b'index.crates.io').hexdigest()[:16]
          sources = []
          for pkg in lock.get('package', []):
              name = pkg['name']
              version = pkg['version']
              checksum = pkg.get('checksum', '')
              if checksum:
                  sources.append({
                      'type': 'file',
                      'url': f'https://static.crates.io/crates/{name}/{name}-{version}.crate',
                      'sha256': checksum,
                      'dest': f'cargo/registry/cache/index.crates.io-{registry_hash}',
                      'dest-filename': f'{name}-{version}.crate'
                  })

          with open('cargo-sources.json', 'w') as f:
              json.dump(sources, f, indent=2)
          "

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: com.github.carosello.yml
          bundle: carosello.flatpak

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: carosello-x86_64.flatpak
          path: carosello.flatpak
