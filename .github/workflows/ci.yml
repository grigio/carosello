name: CI

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            gettext

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Upload binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: carosello-linux-x86_64
          path: target/release/carosello

  flatpak:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      - name: Generate Cargo sources for Flatpak
        run: |
          python3 -c "
          import tomllib, json

          CRATES_IO = 'https://static.crates.io/crates'
          VENDOR_DIR = 'cargo/vendored'

          with open('Cargo.lock', 'rb') as f:
              lock = tomllib.load(f)

          sources = []

          for pkg in lock.get('package', []):
              name = pkg['name']
              version = pkg['version']
              source = pkg.get('source', '')
              checksum = pkg.get('checksum', '')
              if source.startswith('registry+') and checksum:
                  crate_dir = f'{name}-{version}'
                  sources.append({
                      'type': 'archive',
                      'archive-type': 'tar-gzip',
                      'url': f'{CRATES_IO}/{name}/{crate_dir}.crate',
                      'sha256': checksum,
                      'dest': f'{VENDOR_DIR}/{crate_dir}',
                  })
                  sources.append({
                      'type': 'inline',
                      'contents': json.dumps({'package': checksum, 'files': {}}),
                      'dest': f'{VENDOR_DIR}/{crate_dir}',
                      'dest-filename': '.cargo-checksum.json',
                  })

          sources.append({
              'type': 'shell',
              'commands': [
                  'mkdir -p .cargo',
                  'cat > .cargo/config.toml <<\\'EOF\\'\n[source.crates-io]\nreplace-with = \"vendored-sources\"\n\n[source.vendored-sources]\ndirectory = \"/run/build/carosello/cargo/vendored\"\nEOF',
              ],
          })

          with open('cargo-sources.json', 'w') as f:
              json.dump(sources, f, indent=2)
          print(f'Generated {len(sources)} source entries')
          "

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: com.github.carosello.yml
          bundle: carosello.flatpak
          artifact-name: carosello-${{ github.ref_name }}-x86_64.flatpak

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/carosello-linux-x86_64/carosello
            artifacts/carosello-${{ github.ref_name }}-x86_64.flatpak/carosello.flatpak
