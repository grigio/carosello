name: CI

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version sync (Cargo.toml is the source of truth)
        run: |
          CARGO=$(grep '^version =' Cargo.toml | cut -d'"' -f2)
          META=$(grep -oP '<release version="\K[0-9.]+' data/*.metainfo.xml | head -1)
          PKG=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          [ "$CARGO" = "$META" ] || { echo "metainfo $META != cargo $CARGO"; exit 1; }
          [ "$CARGO" = "$PKG" ] || { echo "PKGBUILD $PKG != cargo $CARGO"; exit 1; }
          echo "versions in sync: $CARGO"

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CARGO=$(grep '^version =' Cargo.toml | cut -d'"' -f2)
          [ "${{ github.ref_name }}" = "v$CARGO" ] || { echo "tag ${{ github.ref_name }} != v$CARGO"; exit 1; }

  build:
    runs-on: ubuntu-latest
    # NOT the bare runner image: ubuntu-noble ships libadwaita 1.5.0 while
    # Cargo.toml selects the libadwaita "v1_6" feature, so libadwaita-sys'
    # build script exits 101 *inside the Clippy step* (looks like a lint
    # failure, is not one — Build/Tests are then skipped and `release` is
    # skipped with them). The 26.04 container has libadwaita 1.9.x.
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v5

      # Root inside the container: no sudo, and no toolchain preinstalled.
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            git \
            ca-certificates \
            libgtk-4-dev \
            libadwaita-1-dev \
            gettext

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Registry + target/ cache, invalidating on Cargo.lock. clippy
      # --all-targets and cargo test compile test targets too, so cache
      # them (a cold job otherwise re-fetches every crate).
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-targets: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Upload binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: carosello-linux-x86_64
          path: target/release/carosello

  flatpak:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      - name: Generate Cargo sources for Flatpak
        run: |
          python3 -c "
          import tomllib, json

          CRATES_IO = 'https://static.crates.io/crates'
          VENDOR_DIR = 'cargo/vendored'

          with open('Cargo.lock', 'rb') as f:
              lock = tomllib.load(f)

          sources = []

          for pkg in lock.get('package', []):
              name = pkg['name']
              version = pkg['version']
              source = pkg.get('source', '')
              checksum = pkg.get('checksum', '')
              if source.startswith('registry+') and checksum:
                  crate_dir = f'{name}-{version}'
                  sources.append({
                      'type': 'archive',
                      'archive-type': 'tar-gzip',
                      'url': f'{CRATES_IO}/{name}/{crate_dir}.crate',
                      'sha256': checksum,
                      'dest': f'{VENDOR_DIR}/{crate_dir}',
                  })
                  sources.append({
                      'type': 'inline',
                      'contents': json.dumps({'package': checksum, 'files': {}}),
                      'dest': f'{VENDOR_DIR}/{crate_dir}',
                      'dest-filename': '.cargo-checksum.json',
                  })

          sources.append({
              'type': 'shell',
              'commands': [
                  'mkdir -p .cargo',
                  'cat > .cargo/config.toml <<\\'EOF\\'\n[source.crates-io]\nreplace-with = \"vendored-sources\"\n\n[source.vendored-sources]\ndirectory = \"/run/build/carosello/cargo/vendored\"\nEOF',
              ],
          })

          with open('cargo-sources.json', 'w') as f:
              json.dump(sources, f, indent=2)
          print(f'Generated {len(sources)} source entries')
          "

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.grigio.carosello.yml
          bundle: carosello.flatpak
          artifact-name: carosello-${{ github.ref_name }}-x86_64.flatpak

  # Arch Linux package (.pkg.tar.zst) attached to the tag release, same
  # PKGBUILD a local `makepkg` uses. Runs on the tag only: the upstream
  # tarball it builds from (archive/refs/tags/v<ver>.tar.gz) exists only
  # once the tag is pushed.
  archlinux:
    if: startsWith(github.ref, 'refs/tags/')
    # `versions` proves PKGBUILD pkgver == Cargo.toml == tag before we build
    # a package whose filename embeds that version.
    needs: [versions]
    runs-on: ubuntu-latest
    container:
      # No --privileged: makepkg runs under fakeroot, which does not need
      # extra capabilities (verified in a plain `podman run`).
      image: archlinux:base-devel
    steps:
      # Every step runs as root in a container job, and makepkg refuses to
      # run as root, so the build is handed to an unprivileged user below.
      # git is not part of base-devel and actions/checkout needs it; the
      # keyring must be refreshed first or a stale image fails signature
      # checks on the very first upgrade.
      - name: Bootstrap container
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed
          pacman -S --noconfirm --needed git

      - uses: actions/checkout@v5

      - name: Build package
        run: |
          # makedepends + checkdepends + runtime depends: installing them up
          # front means makepkg never needs sudo (no `-s`/`--syncdeps`).
          pacman -S --noconfirm --needed \
            meson cargo gtk4 libadwaita glib2 graphene hicolor-icon-theme \
            appstream desktop-file-utils gdk-pixbuf2 pacman-contrib

          useradd -m builder
          install -d -o builder -g builder /home/builder/pkg
          cp PKGBUILD gpl-3.0.txt cargo-lock.patch /home/builder/pkg/
          chown -R builder:builder /home/builder/pkg

          # The committed sha256sums can only be recomputed once the tag
          # tarball exists (that is what `updpkgsums` does after a manual
          # release), so derive them from the real archive here.
          su builder -c 'set -e
            cd ~/pkg
            updpkgsums
            makepkg --noconfirm'

          install -d out
          # makepkg also emits a carosello-debug companion package; publish
          # only the runtime one.
          for pkg in /home/builder/pkg/carosello-*.pkg.tar.zst; do
            case "$pkg" in *-debug-*) continue ;; esac
            cp "$pkg" out/
          done
          ls -l out

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: carosello-${{ github.ref_name }}-archlinux-x86_64
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, flatpak, archlinux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history + tags: the release body lists the commits since the
      # previous v* tag (fetch-depth must not be the default shallow clone).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build release notes (titles since the previous tag)
        run: |
          TAG="${{ github.ref_name }}"
          # Version-sorted, newest first, minus the tag being released.
          # `|| true`: with a single tag the grep filter matches nothing.
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$TAG" | head -n1 || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$TAG"
            HEADER="Changes since $PREV:"
          else
            RANGE="$TAG"          # first release: every commit up to the tag
            HEADER="Changes in $TAG:"
          fi
          {
            echo "$HEADER"
            # Empty range (an older tag pushed after a newer one exists)
            # would otherwise produce a body with only the header.
            COMMITS=$(git log --format='- %s' "$RANGE" || true)
            [ -n "$COMMITS" ] || COMMITS=$(git show -s --format='- %s' "$TAG")
            echo "$COMMITS"
          } > RELEASE_NOTES.md
          echo "--- RELEASE_NOTES.md ---"
          cat RELEASE_NOTES.md

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/carosello-linux-x86_64/carosello
            artifacts/carosello-${{ github.ref_name }}-x86_64.flatpak/carosello.flatpak
            artifacts/carosello-${{ github.ref_name }}-archlinux-x86_64/*.pkg.tar.zst

      # Run after the release exists; a separate `on: release` workflow would
      # not be triggered by the GITHUB_TOKEN-created release above.
      - name: Notify FlatPark
        continue-on-error: true
        uses: flatpark/publish-action@b67fca1b80b095541bc011967e0a35292bed14d8 # v1
        with:
          app-id: io.github.grigio.carosello
          tag: ${{ github.ref_name }}
