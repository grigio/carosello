app-id: io.github.grigio.carosello
runtime: org.gnome.Platform
runtime-version: '48'
branch: stable
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: carosello

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build-carosello/cargo

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  # Read-only host access so the app can list sibling images/videos
  # in the containing directory of an opened file, wherever it lives
  # (Pictures, Downloads, /media, /mnt, project dirs, ...).
  # A per-directory grant (xdg-pictures/videos/download only) breaks
  # sibling navigation: the FileChooser portal grants just the single
  # picked file, and read_dir(parent) fails outside those dirs.
  - --filesystem=host:ro
  # Remote/virtual mounts (sftp, smb, ...) via GVfs
  - --filesystem=xdg-run/gvfs:ro
  - --talk-name=org.gtk.vfs
  - --talk-name=org.gtk.vfs.*

modules:
  - name: carosello
    buildsystem: meson
    sources:
      - type: dir
        path: .
      - cargo-sources.json
