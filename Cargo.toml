[package]
name = "carosello"
version = "1.0.6"
edition = "2021"
description = "A fast, minimalist image and video viewer for Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/grigio/carosello"
readme = "README.md"
keywords = ["image", "video", "viewer", "gtk", "gnome"]
categories = ["gui", "multimedia"]

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["gnome_45"] }
gdk-pixbuf = { package = "gdk-pixbuf", version = "0.20" }
libadwaita = { version = "0.7", features = ["v1_5"] }
kamadak-exif = "0.6"
