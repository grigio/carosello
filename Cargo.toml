[package]
name = "carosello"
version = "1.2.2"
edition = "2021"
description = "A fast, minimalist image and video viewer for Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/grigio/carosello"
readme = "README.md"
keywords = ["image", "video", "viewer", "gtk", "gnome"]
categories = ["gui", "multimedia"]

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_6"] }
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }

[profile.release]
lto = true
strip = true
panic = "abort"
# One CGU: max inlining across the crate (marginal but free speed; the
# build is CI-precompiled anyway — IMPROVEMENTS #5).
codegen-units = 1
opt-level = 3

[lints.clippy]
pedantic = { level = "allow", priority = 0 }
